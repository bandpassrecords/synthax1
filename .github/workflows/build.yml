name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: Synthax1-Windows
          - name: macOS
            os: macos-latest
            artifact: Synthax1-macOS
          - name: Linux
            os: ubuntu-22.04
            artifact: Synthax1-Linux

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          project=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)
          if [ "v$project" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the CMakeLists.txt project version $project"
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Cache the JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        # The reference render host is a developer tool that needs a locally installed plugin, so it is not built here.
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DSYNTHAX1_ENABLE_TESTS=ON
          -DSYNTHAX1_BUILD_REFERENCE_HOST=OFF

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        # SynthaX1NativeProcessorTest crashed before this project began and is excluded until it is fixed.
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure -E NativeProcessor

      - name: Collect the plugins, the standalone app and the licenses
        shell: bash
        run: |
          mkdir -p dist
          artefacts=build/Synthax1Plugin_artefacts/${{ env.BUILD_TYPE }}
          cp -R "$artefacts/VST3" dist/
          cp -R "$artefacts/AU" dist/ 2>/dev/null || true
          cp -R "$artefacts/Standalone" dist/
          # The binaries include JUCE under its AGPLv3 option.
          cp LICENSE packaging/BINARY-LICENSE.txt dist/
          mkdir -p dist/licenses
          cp packaging/licenses/AGPL-3.0.txt dist/licenses/
          cp build/_deps/juce-src/LICENSE.md dist/licenses/JUCE-LICENSE.md
          # Linker leftovers next to the Windows bundle are not part of the plugin.
          find dist -maxdepth 2 \( -name '*.exp' -o -name '*.lib' -o -name '*.pdb' \) -delete
          find dist -maxdepth 2 | head -50

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip each platform
        run: |
          cd artifacts
          for dir in */; do
            name=${dir%/}
            (cd "$dir" && zip -r -y "../Synthax1-${GITHUB_REF_NAME}-${name#Synthax1-}.zip" .)
          done
          ls -la
      # The release skill creates the release with its notes first; this only attaches the zips.
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
